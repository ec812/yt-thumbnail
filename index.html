<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Thumbnail Generator</title>
<style>
  :root {
    --bg: #0d0f13;
    --panel: #161a21;
    --panel-2: #1e232c;
    --border: #2a313d;
    --text: #e6eaf0;
    --muted: #8b95a5;
    --accent: #ff5722;
    --accent-2: #ffab40;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    padding: 24px;
    max-width: 1900px;
    margin: 0 auto;
    min-height: 100vh;
  }

  .stage {
    flex: 1 1 auto;
    min-width: 0;
    position: sticky;
    top: 24px;
  }

  .stage-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.2px;
  }

  .badge {
    font-size: 11px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  .canvas-wrap {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    background: #000;
    aspect-ratio: 16 / 9;
  }

  canvas#canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .panel {
    flex: 0 0 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }

  .panel::-webkit-scrollbar { width: 10px; }
  .panel::-webkit-scrollbar-thumb {
    background: #2c3441;
    border-radius: 999px;
    border: 3px solid var(--panel);
  }

  fieldset {
    border: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  legend {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: 700;
    padding: 0;
    margin-bottom: 2px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row > * { flex: 1 1 0; min-width: 0; }

  label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .value {
    font-size: 12px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  input[type="text"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.16);
  }

  input[type="file"] {
    width: 100%;
    font-size: 12px;
    color: var(--muted);
  }

  input[type="file"]::file-selector-button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    margin-right: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
  }

  input[type="file"]::file-selector-button:hover {
    border-color: #3d4757;
  }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    cursor: pointer;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 6px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #10131a;
    box-shadow: 0 0 0 1px var(--accent);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #10131a;
      cursor: pointer;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  .check input {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .presets {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .preset {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    text-align: left;
    transition: border-color 0.15s, transform 0.1s;
  }

  .preset:hover { border-color: #3d4757; }
  .preset:active { transform: scale(0.98); }

  .preset.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .swatch {
    width: 22px;
    height: 14px;
    border-radius: 4px;
    flex: 0 0 auto;
  }

  .meta {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .char {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  button.primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #14100c;
    border: none;
    border-radius: 9px;
    padding: 13px 16px;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.2px;
    transition: filter 0.15s, transform 0.1s;
  }

  button.primary:hover { filter: brightness(1.08); }
  button.primary:active { transform: scale(0.99); }

  button.ghost {
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  button.ghost:hover { color: var(--text); border-color: #3d4757; }

  .divider {
    height: 1px;
    background: var(--border);
  }

  @media (max-width: 1080px) {
    .app {
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }
    .stage { position: static; width: 100%; }
    .panel {
      flex: 1 1 auto;
      width: 100%;
      max-height: none;
      position: static;
    }
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="stage-header">
      <h1>YouTube Thumbnail Generator</h1>
      <span class="badge" id="dims">1280 &times; 720</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas" width="1280" height="720"></canvas>
    </div>
    <p class="hint">Upload a background, set your text, tweak the sliders. Export gives you an exact 1280&times;720 PNG.</p>
  </main>

  <aside class="panel">
    <fieldset>
      <legend>Background</legend>
      <div class="field">
        <input type="file" id="bgInput" accept="image/*" />
        <div class="meta" id="bgName">No image — solid black</div>
      </div>
      <button class="ghost" type="button" id="clearBg">Clear background</button>
    </fieldset>

    <div class="divider"></div>

    <fieldset>
      <legend>Text</legend>
      <label class="check">
        <input type="checkbox" id="presetCjk" />
        Preset line 1 to 直播一會
      </label>
      <div class="field">
        <div class="label-row">
          <label for="line1">Line 1</label>
          <span class="char" id="char1">0</span>
        </div>
        <input type="text" id="line1" placeholder="Main hook" maxlength="60" value="BUILD AN APP" />
      </div>
      <div class="field">
        <div class="label-row">
          <label for="line2">Line 2</label>
          <span class="char" id="char2">0</span>
        </div>
        <input type="text" id="line2" placeholder="Second line" maxlength="60" value="IN 10 MINUTES" />
      </div>
      <div class="field">
        <div class="label-row">
          <label for="line3">Line 3 <span style="opacity:.6">(optional)</span></label>
          <span class="char" id="char3">0</span>
        </div>
        <input type="text" id="line3" placeholder="" maxlength="60" />
      </div>
    </fieldset>

    <div class="divider"></div>

    <fieldset>
      <legend>Text gradient</legend>
      <div class="presets" id="presets"></div>
      <div class="row">
        <div class="field">
          <label for="c1">Start</label>
          <input type="color" id="c1" value="#ffd54f" />
        </div>
        <div class="field">
          <label for="c2">End</label>
          <input type="color" id="c2" value="#ff3d00" />
        </div>
      </div>
    </fieldset>

    <div class="divider"></div>

    <fieldset>
      <legend>Adjust</legend>
      <div class="field">
        <div class="label-row">
          <label for="fontSize">Font size</label>
          <span class="value" id="fontSizeVal">72px</span>
        </div>
        <input type="range" id="fontSize" min="28" max="160" step="1" value="72" />
      </div>
      <div class="field">
        <div class="label-row">
          <label for="textY">Vertical position</label>
          <span class="value" id="textYVal">62%</span>
        </div>
        <input type="range" id="textY" min="0" max="100" step="1" value="62" />
      </div>
      <div class="field">
        <div class="label-row">
          <label for="overlay">Overlay darkness</label>
          <span class="value" id="overlayVal">70%</span>
        </div>
        <input type="range" id="overlay" min="0" max="100" step="1" value="70" />
      </div>
      <div class="field">
        <div class="label-row">
          <label for="overlayStart">Overlay start</label>
          <span class="value" id="overlayStartVal">0%</span>
        </div>
        <input type="range" id="overlayStart" min="0" max="100" step="1" value="0" />
      </div>
    </fieldset>

    <div class="divider"></div>

    <fieldset>
      <legend>Export</legend>
      <button class="primary" type="button" id="download">Download PNG</button>
      <button class="ghost" type="button" id="reset">Reset to defaults</button>
    </fieldset>
  </aside>
</div>

<script>
(function () {
  "use strict";

  var W = 1280;
  var H = 720;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");

  var bgInput = document.getElementById("bgInput");
  var bgName = document.getElementById("bgName");
  var clearBgBtn = document.getElementById("clearBg");

  var line1 = document.getElementById("line1");
  var line2 = document.getElementById("line2");
  var line3 = document.getElementById("line3");
  var presetCjk = document.getElementById("presetCjk");
  var lines = [line1, line2, line3];

  var c1 = document.getElementById("c1");
  var c2 = document.getElementById("c2");
  var presetsEl = document.getElementById("presets");

  var fontSizeEl = document.getElementById("fontSize");
  var fontSizeVal = document.getElementById("fontSizeVal");
  var textYEl = document.getElementById("textY");
  var textYVal = document.getElementById("textYVal");
  var overlayEl = document.getElementById("overlay");
  var overlayVal = document.getElementById("overlayVal");
  var overlayStartEl = document.getElementById("overlayStart");
  var overlayStartVal = document.getElementById("overlayStartVal");

  var downloadBtn = document.getElementById("download");
  var resetBtn = document.getElementById("reset");

  var DEFAULTS = {
    line1: "BUILD AN APP",
    line2: "IN 10 MINUTES",
    line3: "",
    color1: "#ffd54f",
    color2: "#ff3d00",
    fontSize: 72,
    textY: 62,
    overlay: 70,
    overlayStart: 0
  };

  var PRESETS = [
    { name: "Sunset", from: "#ffd54f", to: "#ff3d00" },
    { name: "Ocean", from: "#4fc3f7", to: "#1565c0" },
    { name: "Lime", from: "#d4ff00", to: "#00a86b" },
    { name: "Bubblegum", from: "#ff8ad8", to: "#8e24aa" }
  ];

  var bgImage = null;
  var offscreen = document.createElement("canvas");
  var offCtx = offscreen.getContext("2d");

  function getLines() {
    return lines
      .map(function (input) { return input.value.trim(); })
      .filter(function (v) { return v.length > 0; });
  }

  function coverRect(iw, ih, cw, ch) {
    var scale = Math.max(cw / iw, ch / ih);
    var dw = iw * scale;
    var dh = ih * scale;
    return {
      dx: (cw - dw) / 2,
      dy: (ch - dh) / 2,
      dw: dw,
      dh: dh
    };
  }

  function drawBackground() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, W, H);

    if (!bgImage) return;

    var r = coverRect(bgImage.naturalWidth, bgImage.naturalHeight, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bgImage, r.dx, r.dy, r.dw, r.dh);
  }

  function drawOverlay() {
    var strength = Number(overlayEl.value) / 100;
    if (strength <= 0) return;

    var start = Number(overlayStartEl.value) / 100;
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(Math.min(start, 0.98), "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0," + strength.toFixed(3) + ")");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function gradientClippedLine(text, fontSize, colorA, colorB) {
    ctx.font = "800 " + fontSize + "px " + fontStack(fontSize, text);

    var metrics = ctx.measureText(text);
    var textWidth = Math.ceil(metrics.width);
    var lineHeight = Math.ceil(fontSize * 1.35);
    var padX = Math.ceil(fontSize * 0.25);
    var width = textWidth + padX * 2;

    offscreen.width = width;
    offscreen.height = lineHeight;

    offCtx.clearRect(0, 0, width, lineHeight);
    offCtx.font = ctx.font;
    offCtx.textAlign = "center";
    offCtx.textBaseline = "middle";
    offCtx.fillStyle = "#ffffff";
    offCtx.fillText(text, width / 2, lineHeight / 2);

    offCtx.globalCompositeOperation = "source-in";
    var grad = offCtx.createLinearGradient(0, 0, width, 0);
    grad.addColorStop(0, colorA);
    grad.addColorStop(1, colorB);
    offCtx.fillStyle = grad;
    offCtx.fillRect(0, 0, width, lineHeight);
    offCtx.globalCompositeOperation = "source-over";

    return { canvas: offscreen, width: width, lineHeight: lineHeight };
  }

  function fontStack(fontSize, text) {
    var hasCjk = /[\u3000-\u9fff\uff00-\uffef]/.test(text);
    if (hasCjk) {
      return '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif';
    }
    return '"Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif';
  }

  function drawText() {
    var textLines = getLines();
    if (textLines.length === 0) return;

    var fontSize = Number(fontSizeEl.value);
    var lineHeight = Math.ceil(fontSize * 1.35);
    var blockHeight = lineHeight * textLines.length;
    var pos = Number(textYEl.value) / 100;

    var maxTop = Math.max(0, H - blockHeight);
    var blockTop = Math.round(maxTop * pos);

    for (var i = 0; i < textLines.length; i++) {
      var result = gradientClippedLine(textLines[i], fontSize, c1.value, c2.value);
      var x = Math.round((W - result.width) / 2);
      var y = blockTop + i * lineHeight;

      ctx.drawImage(result.canvas, x, y);
    }
  }

  function render() {
    drawBackground();
    drawOverlay();
    drawText();
  }

  function scheduleRender() {
    render();
  }

  function debounce(fn, wait) {
    var t = null;
    return function () {
      if (t) clearTimeout(t);
      t = setTimeout(fn, wait);
    };
  }

  var renderDebounced = debounce(render, 100);

  function updateCharCounts() {
    lines.forEach(function (input, i) {
      document.getElementById("char" + (i + 1)).textContent = input.value.length;
    });
  }

  function syncSliderLabels() {
    fontSizeVal.textContent = fontSizeEl.value + "px";
    textYVal.textContent = textYEl.value + "%";
    overlayVal.textContent = overlayEl.value + "%";
    overlayStartVal.textContent = overlayStartEl.value + "%";
  }

  function buildPresets() {
    PRESETS.forEach(function (p) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "preset";
      btn.dataset.from = p.from;
      btn.dataset.to = p.to;

      var swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = "linear-gradient(90deg, " + p.from + ", " + p.to + ")";

      var label = document.createElement("span");
      label.textContent = p.name;

      btn.appendChild(swatch);
      btn.appendChild(label);

      btn.addEventListener("click", function () {
        c1.value = p.from;
        c2.value = p.to;
        markActivePreset();
        render();
      });

      presetsEl.appendChild(btn);
    });
  }

  function markActivePreset() {
    var buttons = presetsEl.querySelectorAll(".preset");
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      var match = b.dataset.from === c1.value && b.dataset.to === c2.value;
      b.classList.toggle("active", match);
    }
  }

  function loadImageFile(file) {
    if (!file || !/^image\//.test(file.type)) return;

    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        bgImage = img;
        bgName.textContent = file.name + " — " + img.naturalWidth + "\u00d7" + img.naturalHeight;
        render();
      };
      img.onerror = function () {
        bgName.textContent = "Could not load that image";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function download() {
    if (typeof canvas.toBlob !== "function") {
      alert("Canvas export is not supported in this browser.");
      return;
    }

    canvas.toBlob(function (blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "thumbnail-" + Date.now() + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }, "image/png");
  }

  function reset() {
    line1.value = DEFAULTS.line1;
    line2.value = DEFAULTS.line2;
    line3.value = DEFAULTS.line3;
    presetCjk.checked = false;
    c1.value = DEFAULTS.color1;
    c2.value = DEFAULTS.color2;
    fontSizeEl.value = DEFAULTS.fontSize;
    textYEl.value = DEFAULTS.textY;
    overlayEl.value = DEFAULTS.overlay;
    overlayStartEl.value = DEFAULTS.overlayStart;

    syncSliderLabels();
    updateCharCounts();
    markActivePreset();
    render();
  }

  bgInput.addEventListener("change", function (e) {
    loadImageFile(e.target.files && e.target.files[0]);
  });

  clearBgBtn.addEventListener("click", function () {
    bgImage = null;
    bgInput.value = "";
    bgName.textContent = "No image — solid black";
    render();
  });

  lines.forEach(function (input) {
    input.addEventListener("input", function () {
      updateCharCounts();
      renderDebounced();
    });
  });

  presetCjk.addEventListener("change", function () {
    if (presetCjk.checked) {
      line1.value = "直播一會";
    } else if (line1.value === "直播一會") {
      line1.value = "";
    }
    updateCharCounts();
    render();
  });

  [c1, c2].forEach(function (input) {
    input.addEventListener("input", function () {
      markActivePreset();
      renderDebounced();
    });
  });

  [fontSizeEl, textYEl, overlayEl, overlayStartEl].forEach(function (input) {
    input.addEventListener("input", function () {
      syncSliderLabels();
      renderDebounced();
    });
  });

  downloadBtn.addEventListener("click", download);
  resetBtn.addEventListener("click", reset);

  buildPresets();
  reset();

  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && /^image\//.test(file.type)) {
      loadImageFile(file);
    }
  });
})();
</script>
</body>
</html>
